<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&amp;display=swap');
      .mini-activa {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 20px;
        fill: #0a2e6b;
        letter-spacing: -0.2px;
      }
      .mini-healthpass {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 18px;
        fill: #0a2e6b;
        letter-spacing: -0.2px;
      }
      .mini-tagline {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 8.5px;
        fill: #0a2e6b;
        opacity: 0.85;
        letter-spacing: 0.6px;
      }
    </style>
  </defs>

  <!-- Left Miniature Emblem -->
  <g transform="translate(4, 2) scale(0.75)">
    <!-- Navy Heart Lobe -->
    <path
      d="M 35,21 
         C 30,9 18,4 9,13 
         C 0,22 1,38 13,50 
         C 20,57 29,63 35,66 
         L 35,21 Z"
      fill="#0a2e6b"
    />
    <!-- Green Cross -->
    <rect x="28" y="23" width="13" height="26" rx="2.5" fill="#00A651" />
    <rect x="21" y="30" width="27" height="12" rx="2.5" fill="#00A651" />
    <!-- Green Leaf Arc -->
    <path
      d="M 35,66 
         C 43,62 52,56 58,49 
         C 68,37 69,21 60,12 
         C 51,4 40,9 35,21 
         C 43,27 48,37 48,49 
         C 48,57 43,63 35,66 Z"
      fill="#00833E"
    />
    <path
      d="M 35,66 
         C 44,61 54,53 60,40 
         C 66,27 64,16 58,12 
         C 68,20 68,37 58,49 
         C 49,59 40,64 35,66 Z"
      fill="#00A651"
    />
  </g>

  <!-- Right Compact Typography -->
  <g transform="translate(62, 0)">
    <text x="0" y="30">
      <tspan class="mini-activa">ACTIVA</tspan>
      <tspan dx="5" class="mini-healthpass">HealthPass</tspan>
    </text>
    <text x="0" y="47" class="mini-tagline">Health • Safety • Serenity</text>
  </g>
</svg>
