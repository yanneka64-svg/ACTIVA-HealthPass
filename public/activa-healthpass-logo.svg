<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&amp;display=swap');
      .logo-activa-bold {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 21px;
        fill: #0a2e6b;
        letter-spacing: -0.2px;
      }
      .logo-healthpass-title {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 20px;
        fill: #0a2e6b;
        letter-spacing: -0.3px;
      }
      .logo-tagline-text {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 9.5px;
        fill: #0a2e6b;
        letter-spacing: 0.3px;
      }
    </style>
  </defs>

  <!-- HEALTHCARE EMBLEM -->
  <g id="activa-health-icon" transform="translate(2, 0) scale(0.78)">
    <path
      d="M 35,21 
         C 30,9 18,4 9,13 
         C 0,22 1,38 13,50 
         C 20,57 29,63 35,66 
         L 35,21 Z"
      fill="#0a2e6b"
    />

    <g id="healthcare-cross">
      <rect x="28" y="23" width="13" height="26" rx="2.5" fill="#00A651" />
      <rect x="21" y="30" width="27" height="12" rx="2.5" fill="#00A651" />
    </g>

    <path
      d="M 35,66 
         C 43,62 52,56 58,49 
         C 68,37 69,21 60,12 
         C 51,4 40,9 35,21 
         C 43,27 48,37 48,49 
         C 48,57 43,63 35,66 Z"
      fill="#00833E"
    />
    <path
      d="M 35,66 
         C 44,61 54,53 60,40 
         C 66,27 64,16 58,12 
         C 68,20 68,37 58,49 
         C 49,59 40,64 35,66 Z"
      fill="#00A651"
    />
  </g>

  <!-- RIGHT TYPOGRAPHY -->
  <g id="activa-brand-text" transform="translate(64, 0)">
    <text x="0" y="30">
      <tspan class="logo-activa-bold">ACTIVA</tspan>
      <tspan dx="5" class="logo-healthpass-title">HealthPass</tspan>
    </text>

    <g id="activa-tagline" transform="translate(1, 47)">
      <text x="0" y="0" class="logo-tagline-text">Health</text>
      <circle cx="41" cy="-3.5" r="2.2" fill="#00A651" />
      <text x="51" y="0" class="logo-tagline-text">Safety</text>
      <circle cx="95" cy="-3.5" r="2.2" fill="#00A651" />
      <text x="105" y="0" class="logo-tagline-text">Serenity</text>
    </g>
  </g>
</svg>
