<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACTIVA HealthPass Admin</title>
    <meta name="description" content="Comprehensive Health Insurance Administration & Claims Management System for ACTIVA HealthPass" />
    <meta property="og:title" content="ACTIVA HealthPass Admin" />
    <meta property="og:description" content="Comprehensive Health Insurance Administration & Claims Management System for ACTIVA HealthPass" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- === AMÉLIORATION AJOUTÉE : correctif logo (retour utilisateur, 2026-09-11 — "quand je
         me déconnecte le logo Activa a du mal à s'afficher") === Montserrat (police du texte
         "ACTIVA HealthPass" dans le logo SVG, voir src/components/Logo.tsx) n'était jamais
         déclarée ici : elle était chargée via un @import glissé DANS la balise <style> du SVG,
         réinjecté à chaque affichage du logo — peu fiable sous réseau ralenti (précisément le
         cas pendant la déconnexion, avec l'appel Firebase Auth en cours), pouvant faire traîner
         ou échouer le rendu du texte. Déclarée ici comme les autres polices, chargée une seule
         fois et mise en cache normalement par le navigateur. -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;900&display=swap" rel="stylesheet" />
    <!-- === AMÉLIORATION AJOUTÉE : favicon recadré sur le seul cœur du logo (sans le texte
         "ACTIVA HealthPass" ni le fond bleu qui l'entourait), pour que le cœur reste visible
         et net même quand l'onglet du navigateur est rétréci. === -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="font-sans antialiased bg-[#F8FAFC] text-[#0D2B63] selection:bg-[#0A347B] selection:text-white">

  </body>
</html>
