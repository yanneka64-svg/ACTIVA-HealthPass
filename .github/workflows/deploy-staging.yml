name: CD — Déploiement Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Déployer les Cloud Functions ?'
        required: true
        type: boolean
        default: true
      deploy_rules:
        description: 'Déployer les Security Rules & Indexes ?'
        required: true
        type: boolean
        default: true

# Restriction stricte des permissions OIDC
permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validation & Déploiement Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Lint app & server
        run: npm run lint

      - name: Typecheck functions
        run: npx tsc --noEmit --project tsconfig.json
        working-directory: functions

      - name: Unit & security tests
        run: npm test

      - name: Build functions
        run: npm run build
        working-directory: functions

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Security Rules & Indexes (Staging)
        if: ${{ github.event_name == 'push' || inputs.deploy_rules }}
        run: |
          echo "Déploiement des règles Firestore & Storage et des index sur Staging..."
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project ${{ vars.FIREBASE_PROJECT_ID_STAGING || 'gen-lang-client-0957905786-staging' }} \
            --non-interactive

      - name: Deploy Cloud Functions (Staging)
        if: ${{ github.event_name == 'push' || inputs.deploy_functions }}
        run: |
          echo "Déploiement des Cloud Functions sur Staging..."
          firebase deploy \
            --only functions \
            --project ${{ vars.FIREBASE_PROJECT_ID_STAGING || 'gen-lang-client-0957905786-staging' }} \
            --non-interactive
